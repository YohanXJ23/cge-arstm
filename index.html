  };
  // Diagnostic : si le site n'a pas démarré après 12 secondes, on affiche la cause probable.
  setTimeout(function () {
    if (window.__CGE_STARTED) return;
    if (!window.CGE_CONFIG) return window.__cgeConfigMissing();
    var missing = [];
    if (!window.React) missing.push("React");
    if (!window.ReactDOM) missing.push("ReactDOM");
    if (!window.Babel) missing.push("Babel");
    if (!window.LucideReact) missing.push("Icônes");

// Réduit une image avant l'envoi (une photo de téléphone de 5 Mo devient ~100 à 400 Ko).
const compressImage = (file, max = 700, quality = 0.85) => new Promise((resolve, reject) => {
  if (!file || !file.type || !file.type.startsWith("image/")) return reject(new Error("Ce fichier n'est pas une image."));
  if (file.size > 15 * 1048576) return reject(new Error("Image trop lourde (15 Mo maximum)."));
  const url = URL.createObjectURL(file);
  const img = new window.Image();
  img.onload = () => {
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const type = /png|webp|svg|gif/.test(file.type) ? "image/png" : "image/jpeg";
    c.toBlob((b) => (b ? resolve(b) : reject(new Error("Conversion de l'image impossible."))), type, quality);
  };
  img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image illisible. Essayez une image JPG ou PNG.")); };
  img.src = url;
});

};

  return Math.round((checks.filter(Boolean).length / checks.length) * 100);
}

function useCountUp(target, duration = 1600) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (t) => { if (!start) start = t; const p = Math.min((t - start) / duration, 1); setV(Math.round(target * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return v;
}

// Sondage : formulaire de vote, puis résultats (si le bureau les rend publics).
function PollCard({ poll, myVote, counts, onVote }) {
  const open = isOpenPoll(poll);
  const voted = myVote !== undefined && myVote !== null;
  const [choice, setChoice] = useState(voted ? myVote : null);
  const [editing, setEditing] = useState(false);
  const [busy, setBusy] = useState(false);
  const showForm = open && (!voted || editing);
  const total = counts ? counts.reduce((a, b) => a + b, 0) : 0;
  const submit = async () => {
    if (choice === null) return;
    setBusy(true);
    const ok = await onVote(poll, choice);
    setBusy(false);
    if (ok) setEditing(false);
  };
  return (
    <div className="bg-white rounded-3xl p-6 shadow-sm">
      <div className="flex items-start justify-between gap-3">
        <p className="font-bold text-slate-900 text-lg leading-snug">{poll.question}</p>
        <span className={`flex-shrink-0 text-xs px-2.5 py-1 rounded-full font-semibold ${open ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-600"}`}>{open ? (poll.cloture ? `Jusqu'au ${fmtDate(poll.cloture)}` : "Ouvert") : "Clos"}</span>
      </div>
      {showForm ? (
        <div className="mt-4 space-y-2">
          {poll.options.map((o, i) => (
            <label key={i} className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${choice === i ? "border-orange-500 bg-orange-50" : "border-slate-200 hover:border-orange-300"}`}>
              <input type="radio" name={`poll-${poll.id}`} checked={choice === i} onChange={() => setChoice(i)} className="accent-orange-600" />
              <span className="text-sm text-slate-800">{o}</span>
            </label>
          ))}
          <div className="flex justify-end gap-2 pt-1">
            {editing && <button onClick={() => { setEditing(false); setChoice(myVote); }} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>}
            <button disabled={choice === null || busy} onClick={submit} className="px-5 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 disabled:opacity-50">{busy ? "Envoi..." : voted ? "Modifier mon vote" : "Voter"}</button>
          </div>
        </div>
      ) : (
        <div className="mt-4 space-y-3">
          {counts ? poll.options.map((o, i) => {
            const n = counts[i] || 0;
            const p = total ? Math.round((n * 100) / total) : 0;
            return (
              <div key={i}>
                <div className="flex justify-between gap-3 text-sm"><span className={myVote === i ? "font-bold text-orange-700" : "text-slate-700"}>{o}{myVote === i && " (votre choix)"}</span><span className="font-semibold text-slate-900">{p} %</span></div>
                <div className="mt-1 h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full bg-gradient-to-r from-orange-500 to-amber-400" style={{ width: `${p}%` }} /></div>
              </div>
            );
          }) : <p className="text-sm text-slate-500">{voted ? "Merci pour votre vote ! Les résultats seront communiqués par le bureau." : "Ce sondage est clos."}</p>}
          {counts && <p className="text-xs text-slate-400">{total} participant{total > 1 ? "s" : ""}</p>}
          {open && voted && <button onClick={() => setEditing(true)} className="text-sm text-orange-600 font-semibold">Modifier mon vote</button>}
        </div>
      )}
    </div>
  );
}

// Visionneuse de photos plein écran (flèches du clavier pour naviguer, Échap pour fermer).
function Lightbox({ photos, index, onClose, onIndex }) {
  const p = photos[index];
  const prev = () => onIndex((index - 1 + photos.length) % photos.length);
  const next = () => onIndex((index + 1) % photos.length);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); if (e.key === "ArrowRight") next(); if (e.key === "ArrowLeft") prev(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [index, photos.length]);
  if (!p) return null;
  return (
    <div className="fixed inset-0 z-50 bg-black bg-opacity-90 flex flex-col items-center justify-center p-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-4 right-4 text-white opacity-80 hover:opacity-100" aria-label="Fermer"><X size={30} /></button>
      <img src={p.url} alt={p.legende || p.album} className="max-h-[80vh] max-w-full object-contain rounded-lg shadow-2xl" onClick={(e) => e.stopPropagation()} />
      <p className="text-white text-sm mt-4 text-center max-w-2xl" onClick={(e) => e.stopPropagation()}>{p.legende && <span className="font-semibold">{p.legende} · </span>}<span className="opacity-60">{index + 1} / {photos.length}</span></p>
      {photos.length > 1 && (
        <>
          <button onClick={(e) => { e.stopPropagation(); prev(); }} className="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white bg-opacity-15 hover:bg-opacity-30 text-white flex items-center justify-center" aria-label="Photo précédente"><ChevronLeft size={26} /></button>
          <button onClick={(e) => { e.stopPropagation(); next(); }} className="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white bg-opacity-15 hover:bg-opacity-30 text-white flex items-center justify-center" aria-label="Photo suivante"><ChevronRight size={26} /></button>
        </>
      )}
    </div>
  );
}

  const [baseline, setBaseline] = useState({});
  const defaultSeen = useRef(new Date(Date.now() - 14 * 86400000).toISOString()).current;
  const loadId = useRef(0);
  const quietUntil = useRef(0);
  const busy = useRef(new Set());

  const images = { ...DEFAULT_IMAGES, ...imgOverrides };
  const uid = session?.user?.id || null;

  const notify = (msg, type = "success") => {
    clearTimeout(toastTimer.current);
    setToast({ msg, type });
    toastTimer.current = setTimeout(() => setToast(null), 4000);
  };

  // Évite les doubles clics sur une même action pendant qu'elle s'exécute.
  const once = async (key, fn) => {
    if (busy.current.has(key)) return;
    busy.current.add(key);
    try { await fn(); } finally { busy.current.delete(key); }
  };

  // ----- Session de connexion -----
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  // ----- Chargement des données (relancé à chaque connexion / déconnexion) -----
  const loadAll = async () => {
    const id = ++loadId.current;
    const errors = [];
    const q = (query) => query.then(({ data, error }) => { if (error) errors.push(error); return data ?? []; });
    try {
      let myRow = null;
      if (uid) {
        const { data, error } = await sb.from("profiles").select("*").eq("id", uid).maybeSingle();
        if (id !== loadId.current) return;
        if (error) errors.push(error);
        myRow = data;
        if (!error && (!myRow || myRow.statut !== "actif")) {
          const quiet = Date.now() < quietUntil.current;
          await sb.auth.signOut(); // relance automatiquement le chargement en mode visiteur
          if (!quiet) notify(!myRow ? "Ce compte n'existe plus. Contactez la CGE." : "Votre compte est en attente de validation par l'administrateur.", "error");
          return;
        }
      }
      const active = !!myRow;
      const admin = active && myRow.role === "admin";
      const [n, e, j, a, apps, regs, imgs, mem, st, ap, msgs, temo, ann, ment, mAll, docs, pics, parts, polls, vts, res] = await Promise.all([
        q(sb.from("news").select("*").order("date", { ascending: false })),
        q(sb.from("events").select("*").order("date")),
        active ? q(sb.from("jobs").select("*").order("created_at", { ascending: false })) : [],
        active ? q(sb.from("alumni").select("*").order("name")) : [],
        active ? q(sb.from("applications").select("*").order("id")) : [],
        active ? q(sb.from("registrations").select("*")) : [],
        q(sb.from("site_images").select("*")),
        admin ? q(sb.from("profiles").select("*").order("created_at", { ascending: false })) : [],
        q(sb.rpc("stats_publiques")),
        q(sb.rpc("opportunites_apercu")),
        admin ? q(sb.from("messages").select("*").order("created_at", { ascending: false })) : [],
        q(sb.from("temoignages").select("*").order("created_at", { ascending: false })),
        active ? q(sb.rpc("annuaire_anciens")) : [],
        active ? q(sb.rpc("mes_mentorats")) : [],
        admin ? q(sb.from("mentorat").select("id, statut, created_at")) : [],
        q(sb.from("documents").select("*").order("created_at", { ascending: false })),
        q(sb.from("photos").select("*").order("date", { ascending: false }).order("created_at")),
        q(sb.from("partenaires").select("*").order("ordre").order("created_at")),
        active ? q(sb.from("sondages").select("*").order("created_at", { ascending: false })) : [],
        active ? q(sb.from("votes").select("sondage_id, user_id, choix")) : [],
        active ? q(sb.rpc("resultats_sondages")) : [],
      ]);
      if (id !== loadId.current) return;
      setMe(myRow);
      setProfile(myRow ? rowToProfile(myRow) : EMPTY_PROFILE);
      setNews(n.map(newsFromDb)); setEvents(e); setJobs(j); setAlumni(a);
      setApplications(apps.map(appFromDb)); setRegistrations(regs.map(regFromDb));
      setImgOverrides(Object.fromEntries(imgs.map((r) => [r.key, r.url])));
      setMembers(mem); setMessages(msgs);
      setStats(st && !Array.isArray(st) ? st : {});
      setApercu(Array.isArray(ap) ? ap : []);
      setTemoignages(temo); setAnnuaire(ann); setMentorats(ment); setMentoratAll(mAll);
      setDocuments(docs); setPhotos(pics); setPartenaires(parts); setSondages(polls); setVotes(vts); setResultats(res);
      if (errors.length) notify("Connexion à la base incomplète : " + errors[0].message, "error");
    } catch (err) {
      console.error(err);
      notify("Impossible de joindre la base de données. Vérifiez votre connexion internet.", "error");
    } finally {
      if (id === loadId.current) setFirstLoad(false);
    }
  };
  useEffect(() => { if (authReady) loadAll(); }, [uid, authReady]);

  // L'icône de l'onglet suit le logo choisi par l'administrateur.
  useEffect(() => {
    const link = document.querySelector('link[rel="icon"]');
    if (link && images.logo) link.href = images.logo;
  }, [images.logo]);

  // ----- Navigation et pastilles « Nouveau » -----
  const seenOf = (s) => seen[s] || defaultSeen;
  const sinceFor = (s) => baseline[s] || seenOf(s);
  const go = (p) => {
    if (TRACKED.includes(p)) {
      setBaseline((b) => ({ ...b, [p]: seenOf(p) }));
      const next = { ...seen, [p]: new Date().toISOString() };
      setSeen(next);
      writeSeen(next);
    }
    setPage(p); setMenuOpen(false); window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const goContact = (subject) => { setContactSubject(subject || CONTACT_SUBJECTS[0]); go("contact"); };
  const openLogin = () => { setLoginOpen(true); setMenuOpen(false); };

  const user = me ? { id: me.id, name: accountName(me), role: me.role, email: me.email, type: profile.type } : null;
  const isAdmin = user?.role === "admin";
  const pct = completion(profile);
  const fullName = [profile.prenoms, profile.nom].filter(Boolean).join(" ") || user?.name || "";
  const published = temoignages.filter((t) => t.publie);
  const myTemoignages = user ? temoignages.filter((t) => t.author_id === user.id) : [];
  const receivedPending = mentorats.filter((m) => m.sens === "mentor" && m.statut === "en_attente").length;
  const adminAlerts = members.filter((m) => m.statut === "en_attente").length + messages.filter((m) => !m.lu).length + temoignages.filter((t) => !t.publie).length;
  const myApplications = user ? applications.filter((a) => a.userId === user.id) : [];
  const myRegs = user ? registrations.filter((r) => r.userId === user.id).map((r) => r.eventId) : [];

  // Sondages
  const myVoteOf = (id) => { const v = votes.find((x) => x.sondage_id === id && x.user_id === user?.id); return v ? v.choix : undefined; };
  const countsFor = (id) => {
    const rows = resultats.filter((r) => r.sondage_id === id);
    if (!rows.length) return null;
    const poll = sondages.find((s) => s.id === id);
    return (poll?.options || []).map((_, i) => Number(rows.find((r) => r.choix === i)?.nb || 0));
  };
  const openPolls = sondages.filter(isOpenPoll);
  const pollsToVote = user ? openPolls.filter((s) => myVoteOf(s.id) === undefined) : [];

  const visibleNews = [...news].sort((a, b) => b.date.localeCompare(a.date));
  const sortedEvents = [...events].sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = sortedEvents.filter((e) => daysUntil(e.date) >= 0);
  const pastEvents = sortedEvents.filter((e) => daysUntil(e.date) < 0).reverse();
  const nextEvent = upcoming[0];
  const categories = ["Toutes", ...new Set(visibleNews.map((n) => n.category))];
  const openJobs = jobs.filter((j) => !isExpired(j));
  const official = partenaires.filter((p) => p.role === "Partenaire officiel");

  const newCounts = {
    actualites: visibleNews.filter((n) => newer(n.created_at, seenOf("actualites"))).length + pollsToVote.length,
    evenements: upcoming.filter((e) => newer(e.created_at, seenOf("evenements"))).length,
    opportunites: user ? openJobs.filter((j) => newer(j.created_at, seenOf("opportunites"))).length : 0,
    mediatheque: documents.filter((d) => newer(d.created_at, seenOf("mediatheque"))).length
      + new Set(photos.filter((p) => newer(p.created_at, seenOf("mediatheque"))).map((p) => p.album)).size,
  };

  const navMain = [["actualites", "Actualités"], ["evenements", "Événements"], ["opportunites", "Opportunités"], ["alumni", "Anciens"], ["mediatheque", "Médiathèque"], ["contact", "Contact"]];
  const navAsso = [["apropos", "À propos"], ["bureau", "Le bureau"], ["partenaires", "Partenaires"]];
  const adminNav = isAdmin ? [["admin", `Administration${adminAlerts ? ` (${adminAlerts})` : ""}`]] : [];
  const NavCount = ({ id }) => (newCounts[id] > 0 && page !== id ? <span className="ml-1 min-w-5 h-5 px-1.5 rounded-full bg-orange-600 text-white text-xs font-bold inline-flex items-center justify-center">{newCounts[id]}</span> : null);

  // Pour les membres, on utilise la liste complète (toujours à jour) ; pour les visiteurs, l'aperçu public.
  const homeOpps = user ? [...openJobs].slice(0, 4) : apercu;
  const homeStats = [
    [user ? openJobs.length : stats.offres, "", "Opportunités ouvertes"],
    [stats.membres, "", "Membres inscrits"],
    [stats.anciens, "", "Anciens dans le réseau"],
    [new Date().getFullYear() - ANNEE_CREATION, "", `Ans d'existence (depuis ${ANNEE_CREATION})`],
  ];

  // ----- Connexion, inscription, mot de passe -----
  const handleLogin = async (email, password) => {
    quietUntil.current = Date.now() + 10000;
    const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) return authMessage(error);
    const { data: row, error: e2 } = await sb.from("profiles").select("statut, prenoms, nom, email").eq("id", data.user.id).maybeSingle();
    if (e2 || !row || row.statut !== "actif") {
      await sb.auth.signOut();
      if (e2) return "Connexion à la base impossible : " + e2.message;
      return !row ? "Ce compte n'existe plus. Contactez la CGE." : "Votre compte est en attente de validation par l'administrateur. Réessayez un peu plus tard.";
    }
    setLoginOpen(false);
    notify(`Bienvenue, ${accountName(row)} !`);
    return null;
  };

  const handleRegister = async (r) => {
    quietUntil.current = Date.now() + 10000;
    const { data: free, error: e1 } = await sb.rpc("matricule_disponible", { m: r.matricule });
    if (e1) return "Vérification du matricule impossible : " + e1.message;
    if (free === false) return "Ce matricule possède déjà un compte.";
    const { data, error } = await sb.auth.signUp({
      email: r.email, password: r.password,
      options: { emailRedirectTo: SITE_URL(), data: { prenoms: r.prenoms, nom: r.nom, matricule: r.matricule, filiere: r.filiere, promotion: r.promotion, type: r.type } },
    });
    if (error) return authMessage(error);
    if (data.session) await sb.auth.signOut(); // le compte doit d'abord être validé
    return null;
  };

  const handleForgot = async (email) => {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL() });
    return error ? authMessage(error) : null;
  };

  const logout = async () => { await sb.auth.signOut(); go("accueil"); notify("Vous êtes déconnecté(e)."); };

  // ----- Profil -----
  const updateProfile = async (patch) => {
    if (!me) return false;
    const prev = profileRef.current;
    const next = { ...prev, ...patch };
    profileRef.current = next;
    setProfile(next);
    const { error } = await sb.from("profiles").update(profileToRow(next)).eq("id", me.id);
    if (error) {
      profileRef.current = prev;
      setProfile(prev);
      notify(error.code === "23505" ? "Ce matricule est déjà utilisé par un autre compte." : "Enregistrement impossible : " + error.message, "error");
      return false;
    }
    // L'annuaire dépend du profil d'ancien : on le rafraîchit après chaque modification.
    if (next.type === "ancien" || prev.type === "ancien") sb.rpc("annuaire_anciens").then(({ data }) => data && setAnnuaire(data));
    return true;
  };

  // ----- Images du site -----
  const saveImage = async (key, blob) => {
    if (!blob) {
      const { error } = await sb.from("site_images").delete().eq("key", key);
      if (error) throw new Error("Suppression impossible : " + error.message);
      setImgOverrides(({ [key]: _, ...rest }) => rest);
      return;
    }
    const url = await uploadPublicImage(`site/${slugify(key)}`, blob);
    const { error } = await sb.from("site_images").upsert({ key, url, updated_at: new Date().toISOString() });
    if (error) throw new Error("Enregistrement impossible : " + error.message);
    setImgOverrides((s) => ({ ...s, [key]: url }));
  };

  // ----- Événements et candidatures -----
  const toggleRegistration = (ev) => {
    if (!user) return openLogin();
    once(`reg-${ev.id}`, async () => {
      if (myRegs.includes(ev.id)) {
        const { error } = await sb.from("registrations").delete().eq("event_id", ev.id).eq("user_id", user.id);
        if (error) return notify("Annulation impossible : " + error.message, "error");
        setRegistrations((rs) => rs.filter((r) => !(r.eventId === ev.id && r.userId === user.id)));
        notify("Inscription annulée.");
      } else {
        const { data, error } = await sb.from("registrations").insert({ event_id: ev.id, user_id: user.id, name: fullName }).select().single();
        if (error) return notify("Inscription impossible : " + error.message, "error");
        setRegistrations((rs) => [...rs, regFromDb(data)]);
        notify(`Vous êtes inscrit(e) : ${ev.title}`);
      }
    });
  };

  const apply = (job) => {
    if (!user) return openLogin();
    if (myApplications.some((a) => a.jobId === job.id)) return;
    if (pct < 50) { notify("Complétez votre profil à au moins 50 % avant de postuler.", "error"); go("profil"); return; }
    once(`job-${job.id}`, async () => {
      const { data, error } = await sb.from("applications").insert({
        job_id: job.id, user_id: user.id, title: job.title, company: job.company,
        applicant: fullName, email: profile.email || user.email, cv_name: profile.cv?.name || null,
      }).select().single();
      if (error) return notify("Envoi impossible : " + error.message, "error");
      setApplications((list) => [...list, appFromDb(data)]);
      notify("Candidature envoyée avec votre profil !");
    });
  };

  // ----- Sondages -----
  const vote = async (poll, choix) => {
    const { error } = await sb.from("votes").upsert({ sondage_id: poll.id, user_id: user.id, choix }, { onConflict: "sondage_id,user_id" });
    if (error) { notify("Vote impossible : " + error.message, "error"); return false; }
    setVotes((list) => [...list.filter((v) => !(v.sondage_id === poll.id && v.user_id === user.id)), { sondage_id: poll.id, user_id: user.id, choix }]);
    const { data } = await sb.rpc("resultats_sondages");
    if (data) setResultats(data);
    notify("Merci pour votre vote !");
    return true;
  };

  // ----- Mentorat -----
  const refreshMentorats = async () => {
    const { data, error } = await sb.rpc("mes_mentorats");
    if (!error) setMentorats(data || []);
  };
  const sendMentorRequest = async (mentor, message) => {
    const { error } = await sb.from("mentorat").insert({ eleve_id: user.id, mentor_id: mentor.id, message });
    if (error) {
      notify(error.code === "23505" ? "Vous avez déjà une demande en cours avec cette personne." : "Envoi impossible : " + error.message, "error");
      return false;
    }
    await refreshMentorats();
    notify(`Demande envoyée à ${mentor.nom}. Suivez-la dans Mon espace → Mentorat.`);
    return true;
  };
  const updateMentorat = async (id, patch, msg) => {
    const { error } = await sb.from("mentorat").update(patch).eq("id", id);
    if (error) { notify("Action impossible : " + error.message, "error"); return false; }
    await refreshMentorats();
    if (msg) notify(msg);
    return true;
  };

  // ----- Témoignages -----
  const submitTemoignage = async ({ titre, texte }) => {
    const { data, error } = await sb.from("temoignages").insert({
      author_id: user.id, nom: fullName, promo: profile.promotion || "", poste: profile.poste || "",
      entreprise: profile.entreprise || "", photo: profile.photo || null, titre, texte, publie: false,
    }).select().single();
    if (error) { notify("Envoi impossible : " + error.message, "error"); return false; }
    setTemoignages((list) => [data, ...list]);
    notify("Merci ! Votre témoignage sera publié après validation par le bureau.");
    return true;
  };
  const deleteTemoignage = async (id) => {
    const { error } = await sb.from("temoignages").delete().eq("id", id);
    if (error) return notify("Suppression impossible : " + error.message, "error");
    setTemoignages((list) => list.filter((t) => t.id !== id));
    notify("Témoignage retiré.");
  };

  if (firstLoad) return <FullLoader />;

  const navBtn = (id, label) => (
    <button key={id} onClick={() => go(id)} className={`relative px-2.5 py-2 text-sm font-medium transition whitespace-nowrap inline-flex items-center ${page === id ? "text-orange-600" : "text-slate-600 hover:text-slate-900"}`}>
      {label}<NavCount id={id} />
      {page === id && <span className="absolute left-2.5 right-2.5 -bottom-0.5 h-0.5 rounded-full bg-orange-600" />}
    </button>
  );
  const mobileBtn = (id, label) => (
    <button key={id} onClick={() => go(id)} className={`text-left px-3 py-3 rounded-lg flex items-center ${page === id ? "text-orange-600 bg-orange-50 font-semibold" : "text-slate-700"}`}>{label}<NavCount id={id} /></button>
  );
  const assoActive = navAsso.some(([id]) => id === page);

  return (
    <ImgCtx.Provider value={{ images, overrides: imgOverrides, saveImage }}>
    <div className="min-h-screen bg-stone-50 text-slate-800 font-sans">
      {toast && (
        <div className={`fixed top-5 left-1/2 -translate-x-1/2 z-50 max-w-md w-max px-5 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2 fade-up ${toast.type === "error" ? "bg-rose-600 text-white" : "bg-slate-900 text-white"}`}>
          {toast.type === "error" ? <X size={16} className="flex-shrink-0" /> : <CheckCircle2 size={16} className="text-orange-400 flex-shrink-0" />} {toast.msg}
        </div>
      )}

      {/* ===== EN-TÊTE ===== */}
      <header className="sticky top-0 z-40 bg-white bg-opacity-95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
          <button onClick={() => go("accueil")} className="flex items-center gap-3 text-left">
            <Logo />
            <div>
              <div className="font-extrabold text-slate-900 leading-tight">CGE <span className="text-orange-600">ARSTM</span></div>
              <div className="text-xs text-slate-500">Conférence des Grandes Écoles</div>
            </div>
          </button>
          <nav className="hidden xl:flex items-center gap-0.5">
            {navBtn("accueil", "Accueil")}
            <div className="relative group">
              <button className={`px-2.5 py-2 text-sm font-medium inline-flex items-center gap-1 transition ${assoActive ? "text-orange-600" : "text-slate-600 hover:text-slate-900"}`}>L'association <ChevronDown size={14} /></button>
              <div className="absolute left-0 top-full pt-2 hidden group-hover:block group-focus-within:block">
                <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-2 w-48">
                  {navAsso.map(([id, label]) => (
                    <button key={id} onClick={() => { go(id); if (document.activeElement) document.activeElement.blur(); }} className={`block w-full text-left px-3 py-2 rounded-lg text-sm transition ${page === id ? "bg-orange-50 text-orange-600 font-semibold" : "text-slate-700 hover:bg-orange-50"}`}>{label}</button>
                  ))}
                </div>
              </div>
            </div>
            {navMain.map(([id, label]) => navBtn(id, label))}
            {adminNav.map(([id, label]) => navBtn(id, label))}
          </nav>
          <div className="flex items-center gap-2">
            {user ? (
              <>
                <button onClick={() => go("profil")} className={`relative hidden sm:flex items-center gap-2 pl-1 pr-4 py-1 rounded-full border transition ${page === "profil" ? "border-orange-500 bg-orange-50" : "border-slate-200 hover:border-orange-400"}`}>
                  <Avatar photo={profile.photo} name={fullName} size="w-8 h-8" text="text-xs" />
                  <span className="text-sm font-semibold">Mon espace</span>
                  {receivedPending > 0 && <span className="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-orange-600 text-white text-xs font-bold flex items-center justify-center" title="Demandes de mentorat en attente">{receivedPending}</span>}
                </button>
                <button onClick={logout} className="hidden sm:flex p-2 rounded-full text-slate-500 hover:bg-slate-100" aria-label="Se déconnecter" title="Se déconnecter"><LogOut size={18} /></button>
              </>
            ) : (
              <button onClick={openLogin} className="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 hover:shadow-lg transition">
                <User size={16} /> Espace membre
              </button>
            )}
            <button onClick={() => setMenuOpen(!menuOpen)} className="xl:hidden p-2 relative" aria-label="Menu">
              {menuOpen ? <X /> : <Menu />}
              {!menuOpen && Object.values(newCounts).some((n) => n > 0) && <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-orange-600" />}
            </button>
          </div>
        </div>
        {menuOpen && (
          <div className="xl:hidden border-t border-slate-200 bg-white px-4 py-3 flex flex-col max-h-[80vh] overflow-y-auto">
            {mobileBtn("accueil", "Accueil")}
            {navMain.map(([id, label]) => mobileBtn(id, label))}
            <p className="px-3 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-slate-400">L'association</p>
            {navAsso.map(([id, label]) => mobileBtn(id, label))}
            {adminNav.map(([id, label]) => mobileBtn(id, label))}
            {user ? (
              <>
                <button onClick={() => go("profil")} className="mt-2 px-3 py-3 rounded-lg bg-orange-600 text-white font-semibold text-left">Mon espace{receivedPending > 0 && ` (${receivedPending})`}</button>
                <button onClick={logout} className="mt-2 px-3 py-3 rounded-lg bg-slate-100 text-left">Se déconnecter</button>
              </>
            ) : (
              <button onClick={openLogin} className="mt-2 px-3 py-3 rounded-lg bg-orange-600 text-white font-semibold">Espace membre</button>
            )}
          </div>
        )}
      </header>

      <div key={page} className="fade-up">
        {page === "accueil" && <Home go={go} user={user} openLogin={openLogin} visibleNews={visibleNews} upcoming={upcoming} nextEvent={nextEvent} homeOpps={homeOpps} homeStats={homeStats}
          testimonials={published} partenaires={partenaires} pollsToVote={pollsToVote} countsFor={countsFor} onVote={vote} isNewsNew={(n) => newer(n.created_at, seenOf("actualites"))} />}

        {/* ===== À PROPOS ===== */}
        {page === "apropos" && (
          <>
            <PageHero kicker="Qui sommes-nous" title="La CGE ARSTM" sub="Section ARSTM de la Conférence des Grandes Écoles de Côte d'Ivoire, association des ingénieurs de conception des grandes écoles publiques." icon={Anchor} />
            <main className="max-w-6xl mx-auto px-4 py-16 space-y-16">
              <div className="grid md:grid-cols-5 gap-8 items-center bg-white rounded-3xl shadow-sm p-8 md:p-10">
                <div className="md:col-span-2 text-center rounded-3xl p-8 text-white shadow-xl bg-gradient-to-br from-orange-500 to-orange-700">
                  <p className="text-sm font-bold uppercase tracking-widest opacity-90">Créée en</p>
                  <p className="text-5xl font-extrabold mt-2">Mai 1992</p>
                  <p className="mt-3 text-orange-100">Plus de 30 ans au service des futurs ingénieurs</p>
                </div>
                <div className="md:col-span-3">
                  <p className="text-orange-600 font-bold text-sm uppercase tracking-widest">Notre histoire</p>
                  <h2 className="text-3xl font-extrabold text-slate-900 mt-2">Une association nationale, une section ARSTM</h2>
                  <p className="text-slate-600 mt-4 leading-relaxed">La Conférence des Grandes Écoles de Côte d'Ivoire est une association née en mai 1992 qui regroupe les ingénieurs de conception des grandes écoles publiques.</p>
                  <p className="text-slate-600 mt-3 leading-relaxed">La CGE ARSTM en est la section au sein de l'Académie Régionale des Sciences et Techniques de la Mer d'Abidjan.</p>
                  <p className="text-slate-600 mt-3 leading-relaxed">Parmi ses initiatives : la <strong>Journée de l'Ingénieur</strong>, lancée en 2013 pour rapprocher élèves ingénieurs et entreprises, ainsi que des visites en entreprise pour préparer l'insertion professionnelle.</p>
                </div>
              </div>

              <div className="grid sm:grid-cols-2 gap-5">
                {[[Users, "Le bureau exécutif", "Les élèves élus qui font vivre la CGE cette année.", "bureau"], [Handshake, "Nos partenaires", "Les fondations, entreprises et institutions qui nous accompagnent.", "partenaires"]].map(([Icon, t, d, p]) => (
                  <button key={p} onClick={() => go(p)} className="group text-left bg-white rounded-3xl p-6 shadow-sm hover:shadow-xl transition flex items-center gap-5">
                    <div className="w-14 h-14 flex-shrink-0 rounded-2xl bg-orange-100 flex items-center justify-center group-hover:bg-orange-600 transition"><Icon className="text-orange-600 group-hover:text-white transition" /></div>
                    <div className="flex-1"><p className="font-bold text-slate-900 text-lg">{t}</p><p className="text-sm text-slate-500">{d}</p></div>
                    <ArrowRight className="text-orange-600 group-hover:translate-x-1 transition" />
                  </button>
                ))}
              </div>

              <div>
                <div className="text-center max-w-2xl mx-auto">
                  <p className="text-orange-600 font-bold text-sm uppercase tracking-widest">Le réseau national</p>
                  <h2 className="text-3xl font-extrabold text-slate-900 mt-2">Les grandes écoles membres</h2>
                  <p className="text-slate-500 mt-3">Les élèves ingénieurs de plusieurs grandes écoles publiques ivoiriennes forment ensemble la CGE.</p>
                </div>
                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-5 mt-10">
                  {[["ARSTM", "Académie Régionale des Sciences et Techniques de la Mer"], ["ENSEA", "École Nationale Supérieure de Statistique et d'Économie Appliquée"], ["ESATIC", "École Supérieure Africaine des Technologies de l'Information et de la Communication"]].map(([s, d]) => (
                    <div key={s} className={`rounded-3xl p-6 shadow-sm hover:shadow-xl hover:-translate-y-1 transition ${s === "ARSTM" ? "bg-gradient-to-br from-orange-500 to-orange-700 text-white" : "bg-white text-slate-800"}`}>
                      <SchoolLogo code={s} dark={s === "ARSTM"} />
                      <p className="text-2xl font-extrabold mt-4">{s}</p>
                      <p className={`text-sm mt-2 leading-snug ${s === "ARSTM" ? "text-orange-100" : "text-slate-500"}`}>{d}</p>
                    </div>
                  ))}
                  <div className="rounded-3xl p-6 text-white shadow-sm hover:shadow-xl hover:-translate-y-1 transition" style={{ background: NAVY }}>
                    <SchoolLogo code="INP-HB" dark />
                    <p className="text-2xl font-extrabold mt-4">INP-HB</p>
                    <p className="text-sm mt-2 leading-snug text-slate-300">Institut National Polytechnique Félix Houphouët-Boigny, Yamoussoukro</p>
                    <div className="flex flex-wrap gap-2 mt-4">
                      {["ESA", "ESCAE", "ESI", "ESMG", "ESTP"].map((e) => (
                        <span key={e} className="pl-1.5 pr-3 py-1 rounded-full bg-white bg-opacity-10 border border-white border-opacity-20 text-xs font-bold flex items-center gap-1.5"><SchoolLogo code={e} small />{e}</span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              <div className="grid md:grid-cols-3 gap-6">
                {[[Target, "Notre mission", "Représenter les élèves, défendre leurs intérêts et améliorer leur quotidien à l'Académie."], [Heart, "Nos valeurs", "Solidarité, excellence, respect et ouverture entre filières, promotions et nationalités."], [Lightbulb, "Notre vision", "Former une communauté soudée qui accompagne chaque élève jusqu'à son insertion professionnelle."]].map(([Icon, t, d], i) => (
                  <div key={t} className="group bg-white rounded-3xl p-8 shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300">
                    <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${CARD_GRADIENTS[i]} flex items-center justify-center shadow-lg group-hover:scale-110 transition`}><Icon className="text-white" /></div>
                    <h3 className="text-xl font-bold text-slate-900 mt-5">{t}</h3>
                    <p className="text-slate-600 mt-2">{d}</p>
                  </div>
                ))}
              </div>

              <div>
                <h2 className="text-3xl font-extrabold text-slate-900 text-center">Une année avec la CGE</h2>
                <div className="mt-10 grid md:grid-cols-4 gap-6">
                  {[["Octobre", "Rentrée & assemblée générale"], ["Novembre", "Conférences métiers & sport"], ["Février", "Forum entreprises & stages"], ["Juin", "Gala & remise des diplômes"]].map(([m, t], i) => (
                    <div key={m} className="text-center">
                      <div className="w-14 h-14 mx-auto rounded-full bg-orange-600 text-white flex items-center justify-center font-extrabold text-lg shadow-lg ring-8 ring-orange-100">{i + 1}</div>
                      <p className="text-orange-600 font-bold mt-4 uppercase text-sm tracking-wider">{m}</p>
                      <p className="text-slate-700 mt-1">{t}</p>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </>
        )}

        {/* ===== BUREAU ===== */}
        {page === "bureau" && (
          <>
            <PageHero kicker={MANDAT ? `Mandat ${MANDAT}` : "Le bureau"} title="Le Bureau Exécutif" sub="Des élèves élus et engagés au service de leurs camarades." icon={Users} />
            <main className="max-w-6xl mx-auto px-4 py-16 space-y-14">
              <div className="relative rounded-3xl overflow-hidden text-white p-8 md:p-10 flex flex-col md:flex-row items-center gap-8 shadow-2xl" style={{ background: NAVY }}>
                <div className="absolute -right-10 -bottom-10 w-64 h-64 rounded-full bg-orange-500 opacity-20 blur-3xl" />
                <MemberPhoto name={PRESIDENT.name} size="w-36 h-36" text="text-4xl" className="relative ring-8 ring-white ring-opacity-10" />
                <div className="relative text-center md:text-left">
                  <span className="px-3 py-1 rounded-full bg-orange-600 text-xs font-bold uppercase tracking-wider">Président</span>
                  <h2 className="text-3xl md:text-4xl font-extrabold mt-3">{PRESIDENT.name}</h2>
                  <p className="text-slate-300 mt-2">Président de la CGE — Section ARSTM</p>
                </div>
              </div>
              {BUREAU.map((g) => (
                <div key={g.dept}>
                  <div className="flex items-center gap-3 mb-6">
                    <span className="w-1.5 h-7 rounded-full bg-orange-600" />
                    <h3 className="text-2xl font-bold text-slate-900">{g.dept}</h3>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5">
                    {g.members.filter(([n]) => n !== PRESIDENT.name).map(([name, role], i) => (
                      <div key={name} className="group bg-white rounded-3xl p-6 text-center shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300">
                        <div className="flex justify-center group-hover:scale-105 transition">
                          <MemberPhoto name={name} gradient={i === 0 ? "from-orange-500 to-amber-400" : "from-slate-800 to-slate-600"} />
                        </div>
                        <p className="font-bold text-slate-900 mt-4 text-sm">{name}</p>
                        <p className={`text-xs mt-1 font-medium ${i === 0 ? "text-orange-600" : "text-slate-500"}`}>{role}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </main>
          </>
        )}

        {/* ===== ACTUALITÉS (+ sondages pour les membres) ===== */}
        {page === "actualites" && (
          <>
            <PageHero kicker="Informations" title="Actualités" sub={user ? "Vous voyez aussi les actualités réservées aux membres." : "Connectez-vous pour voir aussi les actualités réservées aux membres."} icon={Megaphone} />
            <main className="max-w-6xl mx-auto px-4 py-16 space-y-14">
              {user && sondages.length > 0 && (
                <div>
                  <SectionTitle kicker="Sondages du bureau" title="Votre avis compte" />
                  <div className="grid md:grid-cols-2 gap-6">
                    {[...openPolls, ...sondages.filter((s) => !isOpenPoll(s))].map((s) => <PollCard key={s.id} poll={s} myVote={myVoteOf(s.id)} counts={countsFor(s.id)} onVote={vote} />)}
                  </div>
                </div>
              )}
              <div>
                <div className="flex flex-wrap gap-2 mb-8">
                  {categories.map((c) => (
                    <button key={c} onClick={() => setNewsFilter(c)} className={`px-4 py-2 rounded-full text-sm font-semibold transition ${newsFilter === c ? "bg-orange-600 text-white shadow-md" : "bg-white text-slate-600 hover:text-orange-600 shadow-sm"}`}>{c}</button>
                  ))}
                </div>
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {visibleNews.filter((n) => newsFilter === "Toutes" || n.category === newsFilter).map((n, i) => <NewsCard key={n.id} n={n} i={i} isNew={newer(n.created_at, sinceFor("actualites"))} />)}
                </div>
                {visibleNews.length === 0 && <p className="text-slate-500 text-center">Aucune actualité pour le moment.</p>}
              </div>
            </main>
          </>
        )}

        {/* ===== ÉVÉNEMENTS ===== */}
        {page === "evenements" && (
          <>
            <PageHero kicker="Agenda" title="Événements" sub="Inscrivez-vous en un clic aux activités de la CGE." icon={Calendar} />
            <main className="max-w-4xl mx-auto px-4 py-16 space-y-5">
              {upcoming.map((e) => {
                const [d, m] = dayMonth(e.date); const reg = myRegs.includes(e.id); const left = daysUntil(e.date);
                return (
                  <div key={e.id} className="group bg-white rounded-3xl p-6 shadow-sm hover:shadow-xl transition flex flex-col sm:flex-row gap-6">
                    <div className="w-20 h-20 flex-shrink-0 rounded-2xl bg-gradient-to-br from-orange-500 to-orange-700 text-white flex flex-col items-center justify-center shadow-lg group-hover:scale-105 transition">
                      <span className="text-3xl font-extrabold leading-none">{d}</span><span className="text-xs uppercase font-semibold">{m}</span>
                    </div>
                    <div className="flex-1">
                      <div className="flex flex-wrap items-center gap-2">
                        <h3 className="text-xl font-bold text-slate-900">{e.title}</h3>
                        <span className="text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 font-bold">{left === 0 ? "Aujourd'hui" : `J-${left}`}</span>
                        {newer(e.created_at, sinceFor("evenements")) && <NewBadge />}
                      </div>
                      <p className="text-sm text-slate-500 mt-1 flex flex-wrap gap-4">{e.time && <span className="flex items-center gap-1"><Clock size={14} /> {e.time}</span>}{e.place && <span className="flex items-center gap-1"><MapPin size={14} /> {e.place}</span>}</p>
                      <p className="text-slate-600 mt-2">{e.text}</p>
                    </div>
                    <button onClick={() => toggleRegistration(e)} className={`self-start sm:self-center px-5 py-3 rounded-xl font-semibold text-sm whitespace-nowrap transition ${reg ? "bg-emerald-100 text-emerald-700 hover:bg-emerald-200" : "bg-orange-600 text-white hover:bg-orange-700 hover:shadow-lg"}`}>
                      {reg ? <span className="flex items-center gap-2"><CheckCircle2 size={16} /> Inscrit(e)</span> : "Je participe"}
                    </button>
                  </div>
                );
              })}
              {upcoming.length === 0 && <p className="text-slate-500 text-center">Aucun événement à venir pour le moment.</p>}

              {pastEvents.length > 0 && (
                <div className="pt-10">
                  <h2 className="text-2xl font-bold text-slate-900 mb-5 flex items-center gap-3"><span className="w-1.5 h-7 rounded-full bg-slate-300" /> Événements passés</h2>
                  <div className="space-y-3">
                    {pastEvents.map((e) => { const [d, m] = dayMonth(e.date); return (
                      <div key={e.id} className="bg-white rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center gap-4 opacity-80">
                        <div className="w-14 h-14 flex-shrink-0 rounded-xl bg-slate-100 text-slate-500 flex flex-col items-center justify-center">
                          <span className="text-xl font-extrabold leading-none">{d}</span><span className="text-xs uppercase font-semibold">{m}</span>
                        </div>
                        <div className="flex-1"><p className="font-bold text-slate-700">{e.title}</p><p className="text-sm text-slate-500">{e.place} · {fmtDate(e.date)}</p></div>
                        {myRegs.includes(e.id) && <span className="self-start sm:self-center text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold">Vous étiez inscrit(e)</span>}
                      </div>
                    ); })}
                  </div>
                  {photos.length > 0 && <button onClick={() => go("mediatheque")} className="mt-5 text-orange-600 font-semibold flex items-center gap-1 hover:gap-2 transition-all">Revoir les photos de nos événements <ChevronRight size={18} /></button>}
                </div>
              )}
            </main>
          </>
        )}

        {/* ===== OPPORTUNITÉS ===== */}
        {page === "opportunites" && (
          <OpportunitiesPage user={user} jobs={openJobs} apercu={apercu} myApplications={myApplications} pct={pct} apply={apply} go={go} openLogin={openLogin} isNew={(j) => newer(j.created_at, sinceFor("opportunites"))} />
        )}

        {/* ===== RÉSEAU DES ANCIENS ===== */}
        {page === "alumni" && (
          <AlumniPage user={user} profile={profile} published={published} annuaire={annuaire} alumni={alumni} mentorats={mentorats}
            onRequest={sendMentorRequest} openLogin={openLogin} go={go} />
        )}

        {/* ===== MÉDIATHÈQUE ===== */}
        {page === "mediatheque" && <MediaPage user={user} documents={documents} photos={photos} notify={notify} openLogin={openLogin} since={sinceFor("mediatheque")} />}

        {/* ===== PARTENAIRES ===== */}
        {page === "partenaires" && <PartnersPage partenaires={partenaires} onBecomePartner={() => goContact("Partenariat / entreprise")} />}

        {/* ===== CONTACT ===== */}
        {page === "contact" && <ContactPage user={user} profile={profile} notify={notify} presetSubject={contactSubject} />}

        {/* ===== MON ESPACE ===== */}
        {page === "profil" && (user
          ? <ProfileSpace uid={user.id} profile={profile} update={updateProfile} pct={pct} fullName={fullName} applications={myApplications} registrations={myRegs} events={events} notify={notify} go={go}
              mentorats={mentorats} onUpdateMentorat={updateMentorat} myTemoignages={myTemoignages} onSubmitTemoignage={submitTemoignage} onDeleteTemoignage={deleteTemoignage} receivedPending={receivedPending} />
          : <main className="max-w-6xl mx-auto px-4 py-20"><Locked onLogin={openLogin} label="à votre espace personnel" /></main>)}

        {/* ===== ADMINISTRATION ===== */}
        {page === "admin" && isAdmin && (
          <>
            <PageHero kicker="Réservé aux administrateurs" title="Administration" icon={Shield} />
            <AdminPanel news={news} setNews={setNews} events={events} setEvents={setEvents} jobs={jobs} setJobs={setJobs} alumni={alumni} setAlumni={setAlumni}
              temoignages={temoignages} setTemoignages={setTemoignages} mentoratAll={mentoratAll}
              documents={documents} setDocuments={setDocuments} photos={photos} setPhotos={setPhotos}
              partenaires={partenaires} setPartenaires={setPartenaires} sondages={sondages} setSondages={setSondages} resultats={resultats} countsFor={countsFor}
              applications={applications} setApplications={setApplications} registrations={registrations}
              members={members} setMembers={setMembers} messages={messages} setMessages={setMessages}
              currentId={user.id} notify={notify} reload={loadAll} />
          </>
        )}
      </div>

      {/* ===== PIED DE PAGE ===== */}
      <footer className="relative text-slate-400 mt-10" style={{ background: "#0b1b33" }}>
        <div className="max-w-6xl mx-auto px-4 py-14 grid md:grid-cols-4 gap-10">
          <div className="md:col-span-2">
            <div className="flex items-center gap-3"><Logo size="w-14 h-14" /><span className="font-extrabold text-white text-lg">CGE <span className="text-orange-500">ARSTM</span></span></div>
            <p className="text-sm mt-4 max-w-sm">Section ARSTM de la Conférence des Grandes Écoles de Côte d'Ivoire, association des ingénieurs de conception des grandes écoles publiques, créée en mai 1992.</p>
          </div>
          <div>
            <h4 className="text-white font-semibold mb-4">Contact</h4>
            {CONTACT.adresse && <p className="text-sm flex items-center gap-2"><MapPin size={14} className="text-orange-500 flex-shrink-0" /> {CONTACT.adresse}</p>}
            {CONTACT.email && <a href={`mailto:${CONTACT.email}`} className="text-sm flex items-center gap-2 mt-2 hover:text-orange-400 transition"><Mail size={14} className="text-orange-500" /> {CONTACT.email}</a>}
            {CONTACT.telephone && <a href={`tel:${CONTACT.telephone.replace(/\s/g, "")}`} className="text-sm flex items-center gap-2 mt-2 hover:text-orange-400 transition"><Phone size={14} className="text-orange-500" /> {CONTACT.telephone}</a>}
            {CONTACT.facebook && <a href={CONTACT.facebook} target="_blank" rel="noopener noreferrer" className="text-sm flex items-center gap-2 mt-2 hover:text-orange-400 transition"><Globe size={14} className="text-orange-500" /> Facebook CGE Côte d'Ivoire</a>}
            <button onClick={() => goContact()} className="text-sm flex items-center gap-2 mt-2 hover:text-orange-400 transition"><Send size={14} className="text-orange-500" /> Nous écrire</button>
            {official[0] && <button onClick={() => go("partenaires")} className="text-sm flex items-center gap-2 mt-4 text-left hover:text-orange-400 transition"><Handshake size={14} className="text-orange-500 flex-shrink-0" /> Partenaire officiel : {official[0].nom}</button>}
          </div>
          <div>
            <h4 className="text-white font-semibold mb-4">Liens rapides</h4>
            <div className="flex flex-col gap-2 text-sm">
              {[...navAsso, ...navMain].map(([id, label]) => <button key={id} onClick={() => go(id)} className="text-left hover:text-orange-400 transition">{label}</button>)}
            </div>
          </div>
        </div>
        <div className="border-t border-slate-800 text-center text-xs py-5">© {new Date().getFullYear()} CGE ARSTM · Tous droits réservés</div>
      </footer>

      {loginOpen && <LoginModal onClose={() => setLoginOpen(false)} onLogin={handleLogin} onRegister={handleRegister} onForgot={handleForgot} />}
      {recovery && <NewPasswordModal onClose={() => setRecovery(false)} notify={notify} />}
    </div>
    </ImgCtx.Provider>
  );
}

// =====================================================================
// PAGE D'ACCUEIL
// =====================================================================
function Home({ go, user, openLogin, visibleNews, upcoming, nextEvent, homeOpps, homeStats, testimonials, partenaires, pollsToVote, countsFor, onVote, isNewsNew }) {
  const left = nextEvent ? daysUntil(nextEvent.date) : null;
  const official = partenaires.filter((p) => p.role === "Partenaire officiel");
  const others = partenaires.filter((p) => p.role !== "Partenaire officiel");
  return (
    <>
      <section className="relative text-white overflow-hidden" style={{ background: NAVY }}>
        <div className="absolute -left-32 top-24 w-96 h-96 rounded-full bg-orange-600 opacity-20 blur-3xl" />
        <div className="absolute right-0 -top-24 w-96 h-96 rounded-full bg-sky-500 opacity-10 blur-3xl" />
        <div className="relative max-w-6xl mx-auto px-4 pt-16 pb-32 grid lg:grid-cols-2 gap-12 items-center">
          <div className="fade-up">
            <span className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white bg-opacity-10 border border-white border-opacity-20 text-xs font-semibold">
              <span className="w-2 h-2 rounded-full bg-orange-500 pulse-dot" /> Bureau exécutif {MANDAT}
            </span>
            <h1 className="text-4xl md:text-6xl font-extrabold mt-6 leading-tight">
              Unis pour naviguer vers <span className="bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent">l'excellence</span>
            </h1>
            <p className="text-slate-300 text-lg mt-6 max-w-xl">Connecter les talents de l'ARSTM, créer des opportunités et construire ensemble l'avenir maritime.</p>
            <div className="flex flex-wrap gap-3 mt-8">
              <button onClick={() => go("opportunites")} className="group px-6 py-3.5 rounded-xl bg-orange-600 font-semibold hover:bg-orange-500 shadow-lg transition flex items-center gap-2">
                Voir les opportunités <ArrowRight size={18} className="group-hover:translate-x-1 transition" />
              </button>
              <button onClick={() => (user ? go("profil") : openLogin())} className="px-6 py-3.5 rounded-xl border border-white border-opacity-30 font-semibold hover:bg-white hover:text-slate-900 transition">
                {user ? "Mon espace" : "Espace membre"}
              </button>
            </div>
          </div>
          <div className="relative hidden lg:block h-96">
            <Compass size={360} strokeWidth={0.5} className="absolute right-4 -top-4 text-white opacity-10 spin-slow" />
            {nextEvent && (
              <div className="float absolute left-0 top-6 w-72 bg-white text-slate-900 rounded-3xl p-6 shadow-2xl">
                <p className="text-xs font-bold text-orange-600 uppercase tracking-wider flex items-center gap-2"><Calendar size={14} /> Prochain événement</p>
                <p className="font-bold mt-2 text-lg leading-snug">{nextEvent.title}</p>
                <p className="text-sm text-slate-500 mt-1">{fmtDate(nextEvent.date)}{nextEvent.place && ` · ${nextEvent.place}`}</p>
                <div className="mt-4"><span className="text-4xl font-extrabold text-orange-600">{left === 0 ? "Aujourd'hui" : `J-${left}`}</span></div>
              </div>
            )}
            <div className="float absolute right-0 bottom-0 w-64 rounded-3xl p-6 shadow-2xl bg-gradient-to-br from-orange-500 to-orange-700" style={{ animationDelay: "1.8s" }}>
              <p className="text-xs font-bold uppercase tracking-wider flex items-center gap-2"><Handshake size={14} /> Mentorat</p>
              <p className="font-semibold mt-2">Échangez avec un ancien de l'ARSTM qui a suivi le chemin dont vous rêvez.</p>
              <button onClick={() => go("alumni")} className="mt-4 text-sm font-bold flex items-center gap-1 hover:gap-2 transition-all">Trouver un mentor <ArrowRight size={15} /></button>
            </div>
          </div>
        </div>
        <Waves />
      </section>

      <div className="bg-orange-600 text-white py-4 overflow-hidden -mt-1">
        <div className="marquee flex whitespace-nowrap w-max">
          {[...FILIERES, ...FILIERES].map((f, i) => (
            <span key={i} className="mx-8 font-semibold flex items-center gap-3"><Anchor size={16} className="opacity-70" /> {f}</span>
          ))}
        </div>
      </div>

      <section className="max-w-6xl mx-auto px-4 relative z-10 mt-12">
        <div className="bg-white rounded-3xl shadow-xl p-8 grid grid-cols-2 md:grid-cols-4 gap-8">
          {homeStats.map(([v, s, l]) => <Stat key={l} value={v} suffix={s} label={l} />)}
        </div>
      </section>

      {pollsToVote.length > 0 && (
        <section className="max-w-6xl mx-auto px-4 pt-20">
          <SectionTitle kicker="Sondage du bureau" title="Votre avis compte" action="Tous les sondages" onAction={() => go("actualites")} />
          <div className="grid md:grid-cols-2 gap-6">
            {pollsToVote.slice(0, 2).map((s) => <PollCard key={s.id} poll={s} counts={countsFor(s.id)} onVote={onVote} />)}
          </div>
        </section>
      )}

      {/* OPPORTUNITÉS DU MOMENT */}
      <section className="max-w-6xl mx-auto px-4 pt-20">
        <SectionTitle kicker="Ne les ratez pas" title="Opportunités du moment" action="Toutes les opportunités" onAction={() => go("opportunites")} />
        {homeOpps.length === 0 ? (
          <div className="bg-white rounded-3xl p-8 text-center text-slate-500 shadow-sm">Aucune opportunité ouverte pour le moment. Revenez bientôt !</div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
            {homeOpps.map((j) => (
              <button key={j.id} onClick={() => go("opportunites")} className="group text-left bg-white rounded-3xl p-6 shadow-sm hover:shadow-xl hover:-translate-y-1 transition flex flex-col">
                <TypeBadge type={j.type} />
                <h4 className="font-bold text-slate-900 mt-4 leading-snug group-hover:text-orange-600 transition">{j.title}</h4>
                <p className="text-sm text-slate-500 mt-2 flex items-center gap-1.5"><MapPin size={13} /> {j.place || j.zone}</p>
                {j.domaine && <p className="text-xs text-slate-400 mt-1">{j.domaine}</p>}
                <div className="mt-auto pt-4"><Deadline date={j.cloture} /></div>
              </button>
            ))}
          </div>
        )}
      </section>

      <section className="max-w-6xl mx-auto px-4 pt-20">
        <SectionTitle kicker="Agenda" title="Prochains événements" action="Voir l'agenda" onAction={() => go("evenements")} />
        <div className="grid md:grid-cols-3 gap-6">
          {upcoming.slice(0, 3).map((e) => { const [d, m] = dayMonth(e.date); return (
            <button key={e.id} onClick={() => go("evenements")} className="group text-left bg-white rounded-3xl p-6 shadow-sm hover:shadow-xl transition flex gap-4 items-center">
              <div className="w-16 h-16 flex-shrink-0 rounded-2xl bg-orange-50 text-orange-600 flex flex-col items-center justify-center group-hover:bg-orange-600 group-hover:text-white transition">
                <span className="text-2xl font-extrabold leading-none">{d}</span><span className="text-xs uppercase font-semibold">{m}</span>
              </div>
              <div><h4 className="font-bold text-slate-900">{e.title}</h4><p className="text-sm text-slate-500 mt-1">{[e.place, e.time].filter(Boolean).join(" · ")}</p></div>
            </button>
          ); })}
          {upcoming.length === 0 && <p className="text-slate-500 md:col-span-3">Aucun événement à venir pour le moment.</p>}
        </div>
      </section>

      <section className="max-w-6xl mx-auto px-4 pt-20">
        <SectionTitle kicker="En ce moment" title="Dernières actualités" action="Tout voir" onAction={() => go("actualites")} />
        <div className="grid md:grid-cols-3 gap-6">
          {visibleNews.slice(0, 3).map((n, i) => <NewsCard key={n.id} n={n} i={i} isNew={isNewsNew(n)} />)}
        </div>
      </section>

function MentorRequestModal({ mentor, profile, onClose, onSend }) {
  const first = mentor.nom.split(" ")[0];
  const suggestion = `Bonjour ${first},\n\nJe suis élève${profile.filiere ? ` en ${profile.filiere}` : ""} à l'ARSTM${profile.promotion ? ` (promotion ${profile.promotion})` : ""}.${profile.objectif ? ` Mon objectif : ${profile.objectif}.` : ""}\n\nVotre parcours m'intéresse beaucoup. Seriez-vous d'accord pour un premier échange afin que je puisse bénéficier de vos conseils ?\n\nMerci d'avance !`;
  const [msg, setMsg] = useState(suggestion);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const send = async () => {
    if (msg.trim().length < 10) return setErr("Votre message est trop court.");
    setBusy(true);
    const ok = await onSend(mentor, msg.trim().slice(0, 1500));
    setBusy(false);
    if (ok) onClose();
  };
  return (
    <ModalShell onClose={onClose} title="Demande de mentorat" sub={`À ${mentor.nom}${mentor.poste ? ` — ${mentor.poste}` : ""}`}>
      <div className="p-8 space-y-4">
        <p className="text-sm text-slate-600">Présentez-vous et expliquez ce que vous attendez. Si {first} accepte, vos coordonnées respectives seront partagées pour poursuivre l'échange.</p>
        <label className="block"><span className="text-xs font-semibold text-slate-600">Votre message ({msg.length}/1500)</span>
          <textarea rows={9} maxLength={1500} value={msg} onChange={(e) => { setMsg(e.target.value); setErr(""); }} className={inputCls} />
        </label>
        {err && <p className="text-sm text-rose-600">{err}</p>}
        <button onClick={send} disabled={busy} className="w-full py-3.5 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 disabled:opacity-60 flex items-center justify-center gap-2"><Send size={17} /> {busy ? "Envoi..." : "Envoyer la demande"}</button>
      </div>
    </ModalShell>
  );
}

// =====================================================================
// MÉDIATHÈQUE : photos, documents, vidéos
// =====================================================================
function MediaPage({ user, documents, photos, notify, openLogin, since }) {
  const [tab, setTab] = useState("photos");
  const [album, setAlbum] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [cat, setCat] = useState("Toutes");
  const [q, setQ] = useState("");

  const albums = Object.values(photos.reduce((acc, p) => {
    if (!acc[p.album]) acc[p.album] = { nom: p.album, photos: [], date: p.date };
    acc[p.album].photos.push(p);
    if (p.date > acc[p.album].date) acc[p.album].date = p.date;
    return acc;
  }, {})).sort((a, b) => b.date.localeCompare(a.date));
  const current = album && albums.find((a) => a.nom === album);
  const files = documents.filter((d) => d.type !== "video");
  const videos = documents.filter((d) => d.type === "video");
  const cats = ["Toutes", ...new Set(files.map((d) => d.categorie))];
  const shownFiles = files.filter((d) => (cat === "Toutes" || d.categorie === cat) && (!q || [d.titre, d.description].join(" ").toLowerCase().includes(q.toLowerCase())));
  const openDoc = (d) => (d.type === "lien" ? window.open(d.lien, "_blank", "noopener") : downloadDoc(d, notify));
  const tabs = [["photos", `Photos (${photos.length})`, Camera], ["documents", `Documents (${files.length})`, FileText], ["videos", `Vidéos (${videos.length})`, Video]];

  return (
    <>
      <PageHero kicker="Souvenirs & ressources" title="Médiathèque" sub="Les photos de nos événements, les documents utiles et nos vidéos." icon={ImageIcon} />
      <main className="max-w-6xl mx-auto px-4 py-16">
        <div className="flex flex-wrap gap-2 mb-8">
          {tabs.map(([k, l, I]) => (
            <button key={k} onClick={() => { setTab(k); setAlbum(null); }} className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-semibold transition ${tab === k ? "bg-orange-600 text-white shadow-md" : "bg-white text-slate-600 hover:text-orange-600 shadow-sm"}`}><I size={16} /> {l}</button>
          ))}
        </div>

        {tab === "photos" && !current && (
          albums.length === 0 ? <p className="text-slate-500 text-center py-10">Aucune photo pour le moment.</p> : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {albums.map((a) => (
                <button key={a.nom} onClick={() => setAlbum(a.nom)} className="group text-left bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl hover:-translate-y-1 transition duration-300">
                  <div className="relative aspect-video bg-slate-100 overflow-hidden">
                    <img src={a.photos[0].url} alt={a.nom} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                    <span className="absolute bottom-3 right-3 px-2.5 py-1 rounded-lg bg-black bg-opacity-60 text-white text-xs font-semibold flex items-center gap-1"><Camera size={12} /> {a.photos.length}</span>
                    {a.photos.some((p) => newer(p.created_at, since)) && <NewBadge className="absolute top-3 left-3 shadow" />}
                  </div>
                  <div className="p-5"><p className="font-bold text-slate-900 group-hover:text-orange-600 transition">{a.nom}</p><p className="text-sm text-slate-500 mt-1">{fmtDate(a.date)}</p></div>
                </button>
              ))}
            </div>
          )
        )}

        {tab === "photos" && current && (
          <div>
            <button onClick={() => setAlbum(null)} className="mb-6 text-orange-600 font-semibold flex items-center gap-1 hover:gap-2 transition-all"><ChevronLeft size={18} /> Tous les albums</button>
            <h2 className="text-2xl font-extrabold text-slate-900">{current.nom}</h2>
            <p className="text-slate-500 mt-1 mb-6">{current.photos.length} photo{current.photos.length > 1 ? "s" : ""} · {fmtDate(current.date)}</p>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
              {current.photos.map((p, i) => (
                <button key={p.id} onClick={() => setLightbox(i)} className="group relative aspect-square rounded-2xl overflow-hidden bg-slate-100">
                  <img src={p.url} alt={p.legende || current.nom} loading="lazy" className="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
                  {p.legende && <span className="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black to-transparent text-white text-xs text-left opacity-0 group-hover:opacity-100 transition">{p.legende}</span>}
                </button>
              ))}
            </div>
            {lightbox !== null && <Lightbox photos={current.photos} index={lightbox} onIndex={setLightbox} onClose={() => setLightbox(null)} />}
          </div>
        )}

        {tab === "documents" && (
          <div className="space-y-5">
            {!user && (
              <div className="rounded-2xl bg-sky-50 border border-sky-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm text-sky-900">
                <span className="flex items-center gap-2"><Lock size={16} /> Certains documents sont réservés aux membres.</span>
                <button onClick={openLogin} className="px-4 py-2 rounded-xl bg-white border border-sky-300 font-semibold">Se connecter</button>
              </div>
            )}
            <div className="bg-white rounded-3xl shadow-sm p-5 flex flex-col md:flex-row gap-3">
              <div className="flex flex-wrap gap-2">
                {cats.map((c) => <button key={c} onClick={() => setCat(c)} className={`px-4 py-2 rounded-full text-sm font-semibold transition ${cat === c ? "bg-orange-600 text-white" : "bg-slate-100 text-slate-600 hover:text-orange-600"}`}>{c}</button>)}
              </div>
              <div className="relative flex-1 min-w-[12rem]">
                <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un document..." className={inputCls + " mt-0 pl-10"} />
              </div>
            </div>
            {shownFiles.map((d) => (
              <div key={d.id} className="bg-white rounded-2xl p-5 shadow-sm hover:shadow-lg transition flex flex-col sm:flex-row sm:items-center gap-4">
                <div className="w-12 h-12 flex-shrink-0 rounded-xl bg-orange-100 flex items-center justify-center">{d.type === "lien" ? <Link2 className="text-orange-600" /> : <FileText className="text-orange-600" />}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex flex-wrap items-center gap-2">
                    <p className="font-bold text-slate-900">{d.titre}</p>
                    {newer(d.created_at, since) && <NewBadge />}
                    {d.members_only && <span className="px-2 py-0.5 rounded-full bg-slate-900 text-white text-xs font-semibold flex items-center gap-1"><Lock size={10} /> Membres</span>}
                  </div>
                  {d.description && <p className="text-sm text-slate-600 mt-1">{d.description}</p>}
                  <p className="text-xs text-slate-400 mt-1">{[d.categorie, d.type === "fichier" && fileSize(d.taille), fmtDate(d.created_at)].filter(Boolean).join(" · ")}</p>
                </div>
                <button onClick={() => openDoc(d)} className="px-4 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 flex items-center justify-center gap-2 whitespace-nowrap">
                  {d.type === "lien" ? <><ExternalLink size={15} /> Ouvrir</> : <><Download size={15} /> Télécharger</>}
                </button>
              </div>
            ))}
            {shownFiles.length === 0 && <p className="text-slate-500 text-center py-8">{files.length ? "Aucun document ne correspond." : "Aucun document pour le moment."}</p>}
          </div>
        )}

        {tab === "videos" && (
          videos.length === 0 ? <p className="text-slate-500 text-center py-10">Aucune vidéo pour le moment.</p> : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {videos.map((v) => {
                const yt = youtubeId(v.lien);
                return (
                  <a key={v.id} href={v.lien} target="_blank" rel="noopener noreferrer" className="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl hover:-translate-y-1 transition duration-300">
                    <div className="relative aspect-video overflow-hidden" style={yt ? {} : { background: NAVY }}>
                      {yt && <img src={`https://img.youtube.com/vi/${yt}/hqdefault.jpg`} alt={v.titre} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />}
                      <div className="absolute inset-0 flex items-center justify-center bg-black bg-opacity-20 group-hover:bg-opacity-30 transition"><PlayCircle size={56} className="text-white drop-shadow-lg" /></div>
                      {newer(v.created_at, since) && <NewBadge className="absolute top-3 left-3 shadow" />}
                      {v.members_only && <span className="absolute top-3 right-3 px-2 py-1 rounded-lg bg-slate-900 text-white text-xs font-semibold flex items-center gap-1"><Lock size={11} /> Membres</span>}
                    </div>
                    <div className="p-5">
                      <p className="font-bold text-slate-900 group-hover:text-orange-600 transition">{v.titre}</p>
                      {v.description && <p className="text-sm text-slate-600 mt-1">{v.description}</p>}
                    </div>
                  </a>
                );
              })}
            </div>
          )
        )}
      </main>
    </>
  );
}

// =====================================================================
// CONTACT
// =====================================================================
function ContactPage({ user, profile, notify, presetSubject }) {
  const init = {
    name: user ? [profile.prenoms, profile.nom].filter(Boolean).join(" ") : "",
    email: user ? profile.email || user.email || "" : "",
    subject: presetSubject || CONTACT_SUBJECTS[0], body: "", website: "",
  };
  const [f, setF] = useState(init);
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const send = async () => {
    if (f.website) return setSent(true); // champ piège invisible : rempli uniquement par les robots
    if (f.name.trim().length < 2) return notify("Indiquez votre nom.", "error");
    if (!EMAIL_RE.test(f.email.trim())) return notify("Adresse email invalide.", "error");
    if (f.body.trim().length < 5) return notify("Votre message est trop court.", "error");
    setBusy(true);
    const { error } = await sb.from("messages").insert({ name: f.name.trim(), email: f.email.trim(), subject: f.subject, body: f.body.trim().slice(0, 3000) });
    setBusy(false);
    if (error) return notify("Envoi impossible : " + error.message, "error");
    setSent(true);
  };

  const infos = [
    [MapPin, "Adresse", CONTACT.adresse, null],
    [Mail, "Email", CONTACT.email, CONTACT.email && `mailto:${CONTACT.email}`],
    [Phone, "Téléphone", CONTACT.telephone, CONTACT.telephone && `tel:${CONTACT.telephone.replace(/\s/g, "")}`],
    [Globe, "Facebook", CONTACT.facebook && "CGE Côte d'Ivoire", CONTACT.facebook],
  ].filter(([, , v]) => v);

  return (
    <>
      <PageHero kicker="Écrivez-nous" title="Contact" sub="Une question, une proposition de partenariat ou une offre à partager ? Le bureau vous répond." icon={Mail} />
      <main className="max-w-6xl mx-auto px-4 py-16 grid lg:grid-cols-5 gap-6">
        <div className="lg:col-span-2 space-y-4">
          {infos.map(([Icon, label, value, href]) => (
            <div key={label} className="bg-white rounded-3xl p-6 shadow-sm flex items-center gap-4">
              <div className="w-12 h-12 flex-shrink-0 rounded-2xl bg-orange-100 flex items-center justify-center"><Icon size={20} className="text-orange-600" /></div>
              <div className="min-w-0">
                <p className="text-xs font-bold uppercase tracking-wider text-slate-400">{label}</p>
                {href ? <a href={href} target={href.startsWith("http") ? "_blank" : undefined} rel="noopener noreferrer" className="font-semibold text-slate-900 hover:text-orange-600 break-words">{value}</a> : <p className="font-semibold text-slate-900">{value}</p>}
              </div>
            </div>
          ))}
          <div className="rounded-3xl p-6 text-white shadow-xl" style={{ background: NAVY }}>
            <Handshake className="text-orange-400" />
            <p className="font-bold text-lg mt-3">Entreprises et partenaires</p>
            <p className="text-sm text-slate-300 mt-2">Vous recrutez des stagiaires ou des jeunes diplômés du maritime ? Choisissez le sujet « Proposer une offre » : nous la diffuserons auprès de nos membres.</p>
          </div>
        </div>

        <div className="lg:col-span-3">
          <Panel title="Envoyer un message" Icon={Send}>
            {sent ? (
              <div className="text-center py-10">
                <div className="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 flex items-center justify-center"><CheckCircle2 className="text-emerald-600" /></div>
                <p className="font-bold text-slate-900 text-lg mt-5">Message envoyé, merci !</p>
                <p className="text-sm text-slate-600 mt-2">Le bureau de la CGE vous répondra à l'adresse indiquée.</p>
                <button onClick={() => { setF(init); setSent(false); }} className="mt-6 px-5 py-2.5 rounded-xl bg-white border border-slate-300 font-semibold text-sm">Écrire un autre message</button>
              </div>
            ) : (
              <div className="space-y-4">
                <div className="grid sm:grid-cols-2 gap-4">
                  <label className="block"><span className="text-xs font-semibold text-slate-600">Nom complet</span><input value={f.name} onChange={set("name")} className={inputCls} /></label>
                  <label className="block"><span className="text-xs font-semibold text-slate-600">Email</span><input type="email" value={f.email} onChange={set("email")} className={inputCls} /></label>
                </div>
                <label className="block"><span className="text-xs font-semibold text-slate-600">Sujet</span>
                  <select value={f.subject} onChange={set("subject")} className={inputCls}>{CONTACT_SUBJECTS.map((s) => <option key={s}>{s}</option>)}</select>
                </label>
                <label className="block"><span className="text-xs font-semibold text-slate-600">Message ({f.body.length}/3000)</span>
                  <textarea rows={6} maxLength={3000} value={f.body} onChange={set("body")} className={inputCls} />
                </label>
                {/* Champ piège anti-robots : invisible pour les humains */}
                <input type="text" value={f.website} onChange={set("website")} tabIndex={-1} autoComplete="off" aria-hidden="true" style={{ position: "absolute", left: "-9999px", width: 1, height: 1 }} />
                <div className="flex justify-end">
                  <button onClick={send} disabled={busy} className="px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700 hover:shadow-lg transition disabled:opacity-60 flex items-center gap-2"><Send size={16} /> {busy ? "Envoi..." : "Envoyer"}</button>
                </div>
              </div>
            )}
          </Panel>
        </div>
      </main>
    </>
  );
}
